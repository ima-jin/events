openapi: "3.1.0"
info:
  title: imajin events
  version: "1.0.0"
  description: >
    Event creation, ticketing, ticket tiers, queue management, hold system, .fair manifests, checkout, and payment webhooks.
    Served by the app itself at /api/spec. Authenticate with a scoped app token (`Authorization: Bearer`, audience `events`,
    scopes `events:read` for GET/HEAD/OPTIONS and `events:write` otherwise) or, during migration, the legacy session cookie.
servers:
  - url: https://events.imajin.ai
    description: production
  - url: https://dev-events.imajin.ai
    description: dev
  - url: http://localhost:3000
    description: local

tags:
  - name: events

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: imajin_session
    bearerAuth:
      type: http
      scheme: bearer
      description: "Scoped app token minted for audience `events` (events:read for safe methods, events:write otherwise)"
    webhookSecret:
      type: http
      scheme: bearer
      description: "Bearer WEBHOOK_SECRET — internal payment webhook from pay service"
  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Not authorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Ticket not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound2:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Event:
      type: object
      properties:
        id: { type: string }
        did: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [draft, published, paused, cancelled, completed] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, nullable: true }
        timezone: { type: string, nullable: true }
        isVirtual: { type: boolean }
        virtualUrl: { type: string, nullable: true }
        venue: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        country: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        fairManifest: { type: object }
        createdAt: { type: string, format: date-time }
    TicketTier:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        currency: { type: string }
        quantity: { type: integer, nullable: true }
        sold: { type: integer }
        available: { type: integer, nullable: true }
        perks: { type: array, items: { type: string } }
        requiresRegistration: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

paths:
  /api/health:
    get:
      tags: [events]
      operationId: healthCheck
      summary: Service health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
                  timestamp: { type: string, format: date-time }

  /api/spec:
    get:
      tags: [events]
      operationId: getSpec
      summary: Serve OpenAPI spec (YAML)
      responses:
        "200":
          description: OpenAPI YAML spec
          content:
            text/yaml:
              schema: { type: string }

  /api/events:
    get:
      tags: [events]
      operationId: listEvents
      summary: List events
      parameters:
        - name: status
          in: query
          schema: { type: string, default: published }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: courseSlug
          in: query
          schema: { type: string }
        - name: upcoming
          in: query
          schema: { type: boolean }
          description: "Filter to events that haven't started yet"
      responses:
        "200":
          description: Events list
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
    post:
      tags: [events]
      operationId: createEvent
      summary: Create an event — requires hard DID
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startsAt]
              properties:
                title: { type: string }
                description: { type: string }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                timezone: { type: string }
                isVirtual: { type: boolean }
                virtualUrl: { type: string }
                venue: { type: string }
                address: { type: string }
                city: { type: string }
                country: { type: string }
                imageUrl: { type: string }
                imageAssetId: { type: string }
                tags: { type: array, items: { type: string } }
                courseSlug: { type: string }
                emtEmail: { type: string }
                tickets:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      description: { type: string }
                      price: { type: number }
                      currency: { type: string }
                      quantity: { type: integer }
                      perks: { type: array, items: { type: string } }
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: "#/components/schemas/Event" }
                  ticketTypes:
                    type: array
                    items: { $ref: "#/components/schemas/TicketTier" }
                  eventKeypair:
                    type: object
                    properties:
                      publicKey: { type: string }
                      privateKey: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Requires hard DID, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/events/mine:
    get:
      tags: [events]
      operationId: listMyEvents
      summary: List authenticated user's events with stats
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: User's events with ticket stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/Event" }
                        - type: object
                          properties:
                            ticketsSold: { type: integer }
                            revenue: { type: number }
                            statusBadge: { type: string }
                            ticketTypes:
                              type: array
                              items: { $ref: "#/components/schemas/TicketTier" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/events/by-did/{did}:
    get:
      tags: [events]
      operationId: getEventByDid
      summary: Look up an event by its DID
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Event found
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    type: object
                    properties:
                      id: { type: string }
                      title: { type: string }
                      did: { type: string }
        "404": { $ref: "#/components/responses/NotFound2" }

  /api/events/{id}:
    get:
      tags: [events]
      operationId: getEvent
      summary: Get event by ID with ticket types and admins
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: "#/components/schemas/Event" }
                  ticketTypes:
                    type: array
                    items: { $ref: "#/components/schemas/TicketTier" }
                  admins: { type: array, items: { type: object } }
        "404": { $ref: "#/components/responses/NotFound2" }
    put:
      tags: [events]
      operationId: updateEvent
      summary: Update event fields — requires creator, admin, or cohost
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                timezone: { type: string }
                isVirtual: { type: boolean }
                virtualUrl: { type: string }
                venue: { type: string }
                address: { type: string }
                city: { type: string }
                country: { type: string }
                imageUrl: { type: string }
                imageAssetId: { type: string }
                tags: { type: array, items: { type: string } }
                status: { type: string }
                metadata: { type: object }
                nameDisplayPolicy:
                  type: string
                  enum: [real_name, handle, anonymous, attendee_choice]
                accessMode: { type: string }
                courseSlug: { type: string }
                emtEmail: { type: string }
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound2" }
    patch:
      tags: [events]
      operationId: updateEventStatus
      summary: Update event status — creator only; follows allowed status transitions
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [draft, published, paused, cancelled, completed]
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: "#/components/schemas/Event" }
        "400": { description: Invalid or disallowed status transition, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Only creator can change status, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/events/{id}/cohosts:
    get:
      tags: [events]
      operationId: listEventCohosts
      summary: List cohosts for an event (via pod membership)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cohost list
          content:
            application/json:
              schema:
                type: object
                properties:
                  cohosts:
                    type: array
                    items:
                      type: object
                      properties:
                        did: { type: string }
                        name: { type: string, nullable: true }
                        handle: { type: string, nullable: true }
                        avatar: { type: string, nullable: true }
                        role: { type: string }
        "404": { description: Event not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

    post:
      tags: [events]
      operationId: addEventCohost
      summary: "Add a cohost to an event (owner only)"
      description: "Adds the target as a cohost via the kernel pods API and syncs them to the event chat (best effort)."
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Identify the cohost by handle or by did, properties: { handle: { type: string }, did: { type: string } } }
      responses:
        "201": { description: Cohost added, content: { application/json: { schema: { type: object, properties: { cohost: { type: object, properties: { did: { type: string }, name: { type: string, nullable: true }, handle: { type: string, nullable: true }, avatar: { type: string, nullable: true }, role: { type: string }, addedAt: { type: string } } } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Only the event owner can add cohosts, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { description: Failed to add cohost, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/events/{id}/guests:
    get:
      tags: [events]
      operationId: listEventGuests
      summary: List all ticket holders with profile info — organizer only
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Guest/ticket list
          content:
            application/json:
              schema:
                type: object
                properties:
                  guests:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        status: { type: string }
                        ownerDid: { type: string }
                        pricePaid: { type: number }
                        currency: { type: string }
                        purchasedAt: { type: string, format: date-time }
                        usedAt: { type: string, format: date-time, nullable: true }
                        paymentMethod: { type: string }
                        ticketType: { type: string }
                        attendeeName: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/events/{id}/invites:
    get:
      tags: [events]
      operationId: listEventInvites
      summary: List invite links — organizer only
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invite list with URLs
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        token: { type: string }
                        label: { type: string }
                        maxUses: { type: integer, nullable: true }
                        useCount: { type: integer }
                        expiresAt: { type: string, format: date-time, nullable: true }
                        url: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [events]
      operationId: createEventInvite
      summary: Create an invite link — organizer only
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                maxUses: { type: integer }
                expiresAt: { type: string, format: date-time }
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite:
                    type: object
                    properties:
                      id: { type: string }
                      token: { type: string }
                      url: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/events/{id}/invites/{inviteId}:
    delete:
      tags: [events]
      operationId: revokeEventInvite
      summary: Revoke an invite link — organizer only
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: inviteId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invite revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Invite not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/events/{id}/my-ticket:
    get:
      tags: [events]
      operationId: getMyTicket
      summary: Check if authenticated user has a ticket or organizer access for this event
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Ticket ownership and access status
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasTicket: { type: boolean }
                  hasAccess: { type: boolean }
                  isOrganizer: { type: boolean }
                  tickets: { type: array, items: { type: object } }
                  ticketId: { type: string }
                  conversationId: { type: string }
                  lobbyConversationId: { type: string }

  /api/events/{id}/access:
    get:
      tags: [events]
      operationId: getEventAccessGate
      summary: Boolean ticket-holder gate for third-party apps
      description: |
        Composable gate (#2395): answers whether a DID holds a ticket for an
        event, as a bare boolean. Never returns ticket rows or any ticket,
        price, or organizer data. Requires a scoped app token with `events:read`;
        session cookies are not accepted.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Event id
        - name: did
          in: query
          required: true
          schema: { type: string }
          description: DID whose ticket holding is being checked
      responses:
        "200":
          description: Whether the DID holds a ticket (and nothing else)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [hasAccess]
                properties:
                  hasAccess: { type: boolean }
        "400": { description: Missing `did` query parameter, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Missing, invalid, or expired app token, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Token lacks the `events:read` scope, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Unknown event, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/events/{id}/fair:
    patch:
      tags: [events]
      operationId: updateEventFair
      summary: Update .fair manifest for an event
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest: { type: object }
      responses:
        "200":
          description: Manifest updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: "#/components/schemas/Event" }
                  manifest: { type: object }
        "400": { description: Invalid .fair manifest, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/events/{id}/queue:
    get:
      tags: [events]
      operationId: getQueue
      summary: Get queue position for a ticket type
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: ticketTypeId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Queue info
          content:
            application/json:
              schema:
                type: object
                properties:
                  inQueue: { type: boolean }
                  position: { type: integer }
                  totalAhead: { type: integer }
                  message: { type: string }
    post:
      tags: [events]
      operationId: joinQueue
      summary: Join the ticket queue
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ticketTypeId: { type: string }
      responses:
        "200":
          description: Joined queue
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [events]
      operationId: leaveQueue
      summary: Leave the ticket queue
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: ticketTypeId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Left queue
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/events/{id}/hold:
    post:
      tags: [events]
      operationId: holdTicket
      summary: Place a hold on a ticket
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticketTypeId]
              properties:
                ticketTypeId: { type: string }
                holdHours: { type: number, default: 72 }
      responses:
        "200":
          description: Hold placed
        "400": { description: Validation error or existing hold, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Ticket type not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [events]
      operationId: releaseHold
      summary: Release a ticket hold
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: ticketId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Hold released
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/events/{id}/tiers:
    get:
      tags: [events]
      operationId: listTicketTiers
      summary: List ticket tiers for an event
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tiers list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tiers:
                    type: array
                    items: { $ref: "#/components/schemas/TicketTier" }
    post:
      tags: [events]
      operationId: createTicketTier
      summary: Create a ticket tier
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name: { type: string }
                description: { type: string }
                price: { type: number }
                currency: { type: string, default: USD }
                quantity: { type: integer }
                perks: { type: array, items: { type: string } }
                sortOrder: { type: integer }
                requiresRegistration: { type: boolean }
                registrationFormId: { type: string }
      responses:
        "201":
          description: Tier created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketTier" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
