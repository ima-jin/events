        content:
          application/json:
            schema: { type: object, required: [subject, markdown], properties: { subject: { type: string }, markdown: { type: string }, filter: { type: object } } }
      responses:
        "200": { description: Message sent, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: Notification delivery failed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Failed to send message, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/events/{id}/sales:
    get:
      tags: [events]
      operationId: listEventSales
      summary: "Sales (orders) with buyer identity and ticket details (organizer or admin)"
      description: "format=xlsx returns CSV (Excel opens it)."
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: Sales as JSON, or a CSV download when format=csv|xlsx, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { description: Failed to load sales, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/events/{id}/sales/export:
    get:
      tags: [events]
      operationId: exportEventSales
      summary: "Export sales as CSV (organizer only)"
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: CSV download, content: { text/csv: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { description: Export failed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/events/{id}/tickets/{ticketId}/cancel:
    post:
      tags: [events]
      operationId: cancelTicket
      summary: "Cancel a held or available (unconfirmed) ticket"
      description: "Only tickets in status held or available; confirmed tickets must use refund."
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: ticketId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Ticket cancelled, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/events/{id}/tickets/{ticketId}/mark-refund-sent:
    post:
      tags: [events]
      operationId: markRefundSent
      summary: "Complete a pending e-transfer refund (owner only)"
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: ticketId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Ticket status flipped from refund_pending to refunded, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { description: Failed to update ticket, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/events/{id}/tickets/{ticketId}/registration-status:
    get:
      tags: [events]
      operationId: getTicketRegistrationStatus
      summary: "Authoritative registration status for a ticket"
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: ticketId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Registration status, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { description: Failed to load status, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/events/{id}/tiers/unlock:
    get:
      tags: [events]
      operationId: unlockTiers
      summary: "Reveal hidden ticket tiers matching an access code (public)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Matching ticket types (case-insensitive code match), content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { description: Failed to unlock tiers, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/migrate-tickets:
    post:
      tags: [events]
      operationId: migrateTickets
      summary: "Migrate soft-DID tickets to a hard DID after email verification (app token only)"
      description: "Requires a scoped app token carrying events:write. Always fails closed."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, hardDid], properties: { email: { type: string }, hardDid: { type: string } } }
      responses:
        "200": { description: Tickets migrated (idempotent), content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { description: Migration failed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/orders/{id}/confirm-payment:
    post:
      tags: [events]
      operationId: confirmOrderPayment
      summary: "Confirm an e-transfer payment for a whole order (organizer only)"
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Held tickets in the order moved from held to valid, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { description: Failed to confirm payment, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/orders/{id}/refund:
    post:
      tags: [events]
      operationId: refundOrder
      summary: "Refund an entire order atomically (organizer only)"
      description: "Stripe orders are refunded through the pay service first; free and e-transfer orders are marked directly."
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Order refunded, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: Pay service refund failed; ticket statuses unchanged, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Failed to refund order, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/webhook/settlement:
    post:
      tags: [events]
      operationId: settlementWebhook
      summary: "settlement.completed event: writes the resolved .fair snapshot to the order"
      security:
        - webhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Snapshot stored }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Missing or invalid webhook secret, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Failed to store snapshot, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/auth/callback:
    get:
      tags: [events]
      operationId: authCallback
      summary: "Sign in with Imajin: handles the kernel redirect and sets the session cookie"
      responses:
        "302": { description: Redirect to the app after the session cookie is set }

  /api/auth/logout:
    post:
      tags: [events]
      operationId: authLogout
      summary: "Clear the session cookie"
      responses:
        "200": { description: Logged out }

  /api/auth/session:
    get:
      tags: [events]
      operationId: authSession
      summary: "Current session (from @ima-jin/auth-client)"
      responses:
        "200": { description: Session payload (null when signed out), content: { application/json: { schema: { type: object } } } }

