openapi: "3.1.0"
info:
  title: imajin-events
  version: "1.0.0"
  description: |
    Standalone Imajin events app: event creation, ticket tiers, ordering and checkout (Stripe via the pay
    service, MJNx balance, e-Transfer, free RSVP), holds and queues, invites, cohosts, guest/sales exports,
    broadcast messaging, .fair manifests, crowdfunding campaigns and payment webhooks.

    This spec is served by the app itself at `/api/spec` (see `app/api/spec/route.ts`) and is the single
    source of truth for the app's HTTP surface. `src/__tests__/api-spec.test.ts` keeps it in lock-step with
    the route files under `app/api/**/route.ts`.

    ## Authentication

    The app talks to the kernel only through the registered-app contract. Callers authenticate to *this* app
    with one of:

    1. **Scoped app token** (preferred): `Authorization: Bearer <app-token>`, minted by the kernel for this
       app's host (`aud` = `IMAJIN_APP_AUDIENCE`, or the host of `NEXT_PUBLIC_APP_URL`). Scopes are enforced:
       `events:read` for safe methods (GET/HEAD/OPTIONS), `events:write` for everything else
       (`src/lib/auth.ts`, `defaultScopesFor`).
    2. **Session cookie** (`imajin_session`, migration fallback): same identity, but carries no scopes, so
       scope checks are not enforced on this path.
    3. **Legacy app headers** (`X-App-DID` + `X-App-Authorization`): still accepted on the handful of routes
       that call `requireAppAuth` from `@ima-jin/auth`, listed as an extra alternative on those operations.

    Operations declare their accepted credentials in `security` (alternatives are OR-ed). Operations that need
    no credentials declare `security: []` and `x-public: true`. Public operations that *optionally* identify
    the caller (for example checkout) say so in their description.

    Further authorization (event creator, organizer = creator or cohost, platform admin from
    `EVENTS_ADMIN_DIDS` / `NODE_DID`, hard identity tier) is checked inside the handlers and surfaces as 403.

    ## Base path

    Paths below are relative to the app base. When the app is mounted under a prefix, set
    `NEXT_PUBLIC_BASE_PATH` (see `next.config.js`) and use the `basePath` server variable.

servers:
  - url: "{origin}{basePath}"
    description: This app. `origin` is NEXT_PUBLIC_APP_URL; `basePath` is NEXT_PUBLIC_BASE_PATH.
    variables:
      origin:
        default: http://localhost:3000
      basePath:
        default: ""

tags:
  - name: platform
    description: Health, spec, session and auth plumbing
  - name: events
  - name: tiers
    description: Ticket tiers (ticket types)
  - name: tickets
  - name: queue
    description: Holds and waiting queue
  - name: invites
  - name: checkout
  - name: orders
  - name: campaign
    description: Crowdfunding campaign pledges
  - name: exports
  - name: webhooks
  - name: proxy
    description: Same-origin proxies to kernel services
  - name: media

components:
  securitySchemes:
    appToken:
      type: http
      scheme: bearer
      description: >
        Scoped app token (`Authorization: Bearer`) minted by the kernel for this app's host. Required scopes
        are listed per operation (`events:read` / `events:write`).
    cookieAuth:
      type: apiKey
      in: cookie
      name: imajin_session
      description: Imajin session cookie (migration fallback; carries no scopes).
    appDidHeader:
      type: apiKey
      in: header
      name: X-App-DID
      description: Legacy app-auth header, must be combined with X-App-Authorization.
    appAuthorizationHeader:
      type: apiKey
      in: header
      name: X-App-Authorization
      description: Legacy app-auth header carrying the attestation id from the user's consent flow.
    webhookBearer:
      type: http
      scheme: bearer
      description: "`Bearer ${WEBHOOK_SECRET}` — shared secret with the pay service."
    webhookSecretHeader:
      type: apiKey
      in: header
      name: x-webhook-secret
      description: "`${WEBHOOK_SECRET}` — shared secret sent by the kernel event bus."

  parameters:
    EventId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Event id (`evt_...`)
    TicketId:
      name: ticketId
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid or missing input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not authenticated (no/invalid/expired credential)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not allowed (missing scope, not organizer/creator/admin, or soft DID)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicts with current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              retryAfter: { type: integer }
    ServerError:
      description: Unexpected failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: Upstream kernel/pay service failed or is unreachable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Event:
      type: object
      description: >
        Row of `events.events`. Reads authenticated through the legacy app headers return the reduced
        projection (no `privateKey`, `publicKey`, `metadata`, `eventType`, ...).
      properties:
        id: { type: string }
        did: { type: string }
        publicKey: { type: string }
        privateKey:
          type: string
          nullable: true
          description: >
            Event signing key. NOTE: the default (non-app-header) read paths of GET /api/events and
            GET /api/events/{id} currently serialise the whole row, including this field (kernel parity gap,
            tracked in the port notes).
        creatorDid: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, nullable: true }
        timezone: { type: string, nullable: true }
        locationType: { type: string, enum: [physical, virtual, hybrid] }
        isVirtual: { type: boolean }
        virtualUrl: { type: string, nullable: true }
        venue: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        country: { type: string, nullable: true }
        status: { type: string, enum: [draft, published, paused, cancelled, completed] }
        eventType: { type: string, enum: [event, campaign] }
        targetAmount: { type: integer, nullable: true, description: Campaign goal in cents }
        deadline: { type: string, format: date-time, nullable: true }
        accessMode: { type: string }
        imageUrl: { type: string, nullable: true }
        imageAssetId: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        metadata:
          type: object
          description: Free-form; `metadata.fair` holds the .fair manifest.
        nameDisplayPolicy: { type: string, enum: [real_name, handle, anonymous, attendee_choice] }
        chatEnabled: { type: boolean }
        courseSlug: { type: string, nullable: true }
        currency: { type: string, nullable: true }
        emtEmail: { type: string, nullable: true }
        podId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EventInput:
      type: object
      description: Event fields accepted by create and update.
      properties:
        title: { type: string }
        description: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, nullable: true }
        timezone: { type: string, nullable: true }
        locationType: { type: string, enum: [physical, virtual, hybrid] }
        isVirtual: { type: boolean }
        virtualUrl: { type: string }
        venue: { type: string }
        address: { type: string }
        city: { type: string }
        country: { type: string }
        imageUrl: { type: string }
        imageAssetId: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        courseSlug: { type: string, nullable: true }
        emtEmail: { type: string, nullable: true }
        nameDisplayPolicy: { type: string, enum: [real_name, handle, anonymous, attendee_choice] }
        chatEnabled: { type: boolean }
    TicketTier:
      type: object
      description: Row of `events.ticket_types`, plus computed `available`.
      properties:
        id: { type: string }
        eventId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: integer, description: Minor units (cents) }
        currency: { type: string }
        quantity: { type: integer, nullable: true, description: null = unlimited }
        sold: { type: integer }
        available: { type: integer, nullable: true }
        perks: { type: array, items: { type: string } }
        sortOrder: { type: integer }
        requiresRegistration: { type: boolean }
        registrationFormId: { type: string, nullable: true }
        maxPerOrder: { type: integer, nullable: true }
        accessCode: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Ticket:
      type: object
      description: Row of `events.tickets`.
      properties:
        id: { type: string }
        eventId: { type: string }
        ticketTypeId: { type: string }
        ownerDid: { type: string, nullable: true }
        orderId: { type: string, nullable: true }
        status:
          type: string
          enum: [available, held, valid, used, cancelled, refund_pending, refunded]
        pricePaid: { type: integer, nullable: true }
        currency: { type: string, nullable: true }
        paymentMethod: { type: string, nullable: true, enum: [stripe, etransfer, balance, free] }
        heldBy: { type: string, nullable: true }
        heldUntil: { type: string, format: date-time, nullable: true }
        holdExpiresAt: { type: string, format: date-time, nullable: true }
        registrationStatus: { type: string, enum: [not_required, pending, complete] }
        purchasedAt: { type: string, format: date-time, nullable: true }
        usedAt: { type: string, format: date-time, nullable: true }
        lastEmailSentAt: { type: string, format: date-time, nullable: true }
    CartItem:
      type: object
      required: [ticketTypeId, quantity]
      properties:
        ticketTypeId: { type: string }
        quantity: { type: integer, minimum: 1 }
    CheckoutRequest:
      type: object
      required: [eventId]
      description: >
        Single-tier form (`ticketTypeId` + `quantity`) or multi-tier form (`items`). An invite token may be
        given as `invite` or as the `?invite=` query parameter.
      properties:
        eventId: { type: string }
        ticketTypeId: { type: string }
        quantity: { type: integer, minimum: 1 }
        items: { type: array, items: { $ref: "#/components/schemas/CartItem" } }
        email: { type: string, format: email, description: Guest checkout email (soft DID is resolved from it) }
        name: { type: string }
        invite: { type: string }
    EtransferOrder:
      type: object
      properties:
        orderId: { type: string }
        ticketIds: { type: array, items: { type: string } }
        instructions:
          type: object
          properties:
            email: { type: string, description: Event's e-Transfer recipient (`emtEmail`) }
            amount: { type: number, description: Major units }
            currency: { type: string }
            memo: { type: string, description: "`ORD-<orderId>`" }
            deadline: { type: string, format: date-time }
            quantity: { type: integer }
            message: { type: string }

paths:
  /api/health:
    get:
      tags: [platform]
      operationId: healthCheck
      summary: Service health check
      x-public: true
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: imajin-events }
                  timestamp: { type: string, format: date-time }

  /api/spec:
    get:
      tags: [platform]
      operationId: getSpec
      summary: Serve this OpenAPI document (YAML)
      x-public: true
      security: []
      responses:
        "200":
          description: OpenAPI YAML spec
          content:
            text/yaml:
              schema: { type: string }

  /api/me:
    get:
      tags: [platform]
      operationId: getMe
      summary: Return the signed-in caller's DID (session cookie only)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The caller's DID
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/callback:
    get:
      tags: [platform]
      operationId: authCallback
      summary: Kernel login redirect target (published `@ima-jin/auth-client` handler)
      description: >
        Receives `attestation_id` and `user_did` from the kernel consent flow, sets the session cookie and
        redirects. Failures redirect back with `?auth_error=...`.
      x-public: true
      security: []
      parameters:
        - { name: attestation_id, in: query, schema: { type: string } }
        - { name: user_did, in: query, schema: { type: string } }
      responses:
        "302":
          description: Redirect to the post-login page

  /api/auth/logout:
    post:
      tags: [platform]
      operationId: authLogout
      summary: Clear the session cookie (published `@ima-jin/auth-client` handler)
      x-public: true
      security: []
      responses:
        "302":
          description: Redirect to the post-logout page with the session cookie cleared

  /api/auth/session:
    get:
      tags: [platform]
      operationId: authSession
      summary: Current session user from the cookie, or null (published `@ima-jin/auth-client` handler)
      x-public: true
      security: []
      responses:
        "200":
          description: The session user, or `null` when signed out
          content:
            application/json:
              schema:
                type: object
                nullable: true
                properties:
                  did: { type: string }
                  displayName: { type: string }
                  handle: { type: string }
                  avatar: { type: string }

  # ───────────────────────── events ─────────────────────────
  /api/events:
    get:
      tags: [events]
      operationId: listEvents
      summary: List events
      description: >
        Public. When `X-App-DID` is sent, the legacy app path is used instead: it requires `events:read` and
        returns the reduced event projection.
      x-public: true
      security: []
      parameters:
        - { name: status, in: query, schema: { type: string, default: published } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: courseSlug, in: query, schema: { type: string } }
        - name: upcoming
          in: query
          schema: { type: boolean }
          description: Only events that have not started yet (also switches ordering to soonest-first)
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [events]
      operationId: createEvent
      summary: Create an event (requires a hard DID)
      description: >
        Registers a new event DID with the kernel, builds the .fair manifest, creates optional ticket types
        and, when chat is available, the event conversation. Hard-DID check: soft (email-only) identities get 403.
        Also accepts the legacy app headers (`events:write`).
      security:
        - appToken: [events:write]
        - cookieAuth: []
        - appDidHeader: []
          appAuthorizationHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/EventInput" }
                - type: object
                  required: [title, startsAt]
                  properties:
                    eventType: { type: string, enum: [event, campaign], default: event }
                    targetAmount:
                      type: integer
                      description: Required positive integer (cents) when `eventType` is `campaign`
                    deadline: { type: string, format: date-time }
                    tickets:
                      type: array
                      items:
                        type: object
                        properties:
                          name: { type: string }
                          description: { type: string }
                          price: { type: integer }
                          currency: { type: string }
                          quantity: { type: integer }
                          perks: { type: array, items: { type: string } }
      responses:
        "201":
          description: Event created (status `draft`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: "#/components/schemas/Event" }
                  ticketTypes:
                    type: array
                    items: { $ref: "#/components/schemas/TicketTier" }
                  eventKeypair:
                    type: object
                    description: Returned exactly once; the creator must store the private key.
                    properties:
                      publicKey: { type: string }
                      privateKey: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/events/mine:
    get:
      tags: [events]
      operationId: listMyEvents
      summary: List the caller's events with ticket stats
      security:
        - appToken: [events:read]
        - cookieAuth: []
      responses:
        "200":
          description: Events created by the caller, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/Event" }
                        - type: object
                          properties:
                            ticketsSold: { type: integer }
                            revenue: { type: integer, description: Sum of price × sold across tiers (minor units) }
                            statusBadge: { type: string, description: "`live`/`past` for published events, otherwise the status" }
                            ticketTypes:
                              type: array
                              items: { $ref: "#/components/schemas/TicketTier" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/events/by-did/{did}:
    get:
      tags: [events]
      operationId: getEventByDid
      summary: Look up an event by its DID
      x-public: true
      security: []
      parameters:
        - { name: did, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Event found
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    type: object
                    properties:
                      id: { type: string }
                      title: { type: string }
                      did: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/events/{id}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [events]
      operationId: getEvent
      summary: Get an event with its ticket types
      description: >
        Public. When `X-App-DID` is sent, the legacy app path requires `events:read` and returns the reduced
        event projection.
      x-public: true
      security: []
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: "#/components/schemas/Event" }
                  ticketTypes:
                    type: array
                    items: { $ref: "#/components/schemas/TicketTier" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [events]
      operationId: updateEvent
      summary: Update event fields (creator or cohost)
      security:
        - appToken: [events:write]
        - cookieAuth: []
        - appDidHeader: []
          appAuthorizationHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/EventInput" }
                - type: object
                  properties:
                    status: { type: string }
                    metadata: { type: object }
                    accessMode: { type: string }
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [events]
      operationId: updateEventStatus
      summary: Change event status (creator only, allowed transitions only)
      description: >
        Transitions: draft → published; published → paused, cancelled, completed; paused → published,
        cancelled. `cancelled` and `completed` are terminal.
      security:
        - appToken: [events:write]
        - cookieAuth: []
        - appDidHeader: []
          appAuthorizationHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [draft, published, paused, cancelled, completed] }
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: "#/components/schemas/Event" }
        "400":
          description: Invalid status or disallowed transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/events/{id}/tiers:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [tiers]
      operationId: listTiers
      summary: List public ticket tiers (access-code tiers excluded)
      description: Public. With `X-App-DID` the legacy app path requires `events:read`.
      x-public: true
      security: []
      responses:
        "200":
          description: Tiers ordered by `sortOrder`
          content:
            application/json:
              schema:
                type: object
                properties:
                  tiers:
                    type: array
                    items: { $ref: "#/components/schemas/TicketTier" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [tiers]
      operationId: createTier
      summary: Create a tier (creator or cohost)
      description: When `currency` is omitted it defaults to the event's most common tier currency, else `CAD`.
      security:
        - appToken: [events:write]
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name: { type: string }
                description: { type: string }
                price: { type: integer, minimum: 0 }
                currency: { type: string }
                quantity: { type: integer, nullable: true }
                perks: { type: array, items: { type: string } }
                sortOrder: { type: integer }
                requiresRegistration: { type: boolean }
                registrationFormId: { type: string }
                accessCode: { type: string }
      responses:
        "201":
          description: Tier created
          content:
            application/json:
              schema:
                type: object
                properties:
                  tier: { $ref: "#/components/schemas/TicketTier" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [tiers]
      operationId: updateTier
      summary: Update a tier under append-only rules (creator or cohost)
      description: >
        Once tickets are sold the currency cannot change, the price cannot go down and quantity/perks may only
        grow; violations return 400 with a `violations` list. An empty change set returns the tier unchanged
        with `message: "No changes"`.
      security:
        - appToken: [events:write]
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tierId]
              properties:
                tierId: { type: string }
                name: { type: string }
                description: { type: string }
                price: { type: integer }
                currency: { type: string }
                quantity: { type: integer, nullable: true }
                perks: { type: array, items: { type: string } }
                sortOrder: { type: integer }
                requiresRegistration: { type: boolean }
                registrationFormId: { type: string, nullable: true }
                accessCode: { type: string, nullable: true }
      responses:
        "200":
          description: Tier updated (or unchanged)
          content:
            application/json:
              schema:
                type: object
                properties:
                  tier: { $ref: "#/components/schemas/TicketTier" }
                  message: { type: string }
        "400":
          description: Missing `tierId` or append-only policy violation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  violations: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/events/{id}/tiers/unlock:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [tiers]
      operationId: unlockTiers
      summary: Reveal hidden tiers matching an access code (case-insensitive)
      x-public: true
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Matching tiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  tiers:
                    type: array
                    items: { $ref: "#/components/schemas/TicketTier" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ───────────────────────── tickets ─────────────────────────
  /api/events/{id}/tickets/{ticketId}/cancel:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/TicketId"
    post:
      tags: [tickets]
      operationId: cancelTicket
      summary: Cancel a held or available (unconfirmed) ticket (creator or cohost)
      security:
        - appToken: [events:write]
        - cookieAuth: []
      responses:
        "200":
          description: Ticket cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/events/{id}/tickets/{ticketId}/mark-refund-sent:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/TicketId"
    post:
      tags: [tickets]
      operationId: markRefundSent
      summary: Complete a pending e-Transfer refund (`refund_pending` → `refunded`)
      security:
        - appToken: [events:write]
        - cookieAuth: []
      responses:
        "200":
          description: Refund marked as sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    type: object
                    properties:
                      id: { type: string }
                      status: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/events/{id}/tickets/{ticketId}/refund:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/TicketId"
    post:
      tags: [tickets]
      operationId: refundTicket
      summary: Refund a valid ticket (creator or cohost)
      description: >
        Stripe tickets are refunded through the pay service first. e-Transfer tickets move to
        `refund_pending` and the response carries `manualRefundRequired`. Free tickets skip the pay service.
      security:
        - appToken: [events:write]
        - cookieAuth: []
      responses:
        "200":
          description: Ticket refunded or refund pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    type: object
                    properties:
                      id: { type: string }
                      status: { type: string }
                  manualRefundRequired: { type: boolean }
                  refundEmail: { type: string }
                  refundAmount: { type: string }
                  refundCurrency: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/tickets/{id}/confirm-payment:
    post:
      tags: [tickets]
      operationId: confirmTicketPayment
      deprecated: true
      summary: Confirm an e-Transfer hold for a ticket (use the order-level route instead)
      description: Creator or cohost only. Kept for orphan tickets without an order.
      security:
        - appToken: [events:write]
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Held tickets confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { $ref: "#/components/schemas/Ticket" }
                  confirmedCount: { type: integer }
                  orderId: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/checkout:
    post:
      tags: [checkout]
      operationId: createCheckoutSession
      summary: Create a Stripe checkout session via the pay service
      description: >
        Public (rate limited). If the caller is authenticated their DID is the buyer; otherwise an email is
        required and a soft DID is resolved. Increments the invite's `usedCount` when an invite token is used.
      x-public: true
      security: []
      parameters:
        - { name: invite, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "200":
          description: Checkout session
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  sessionId: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/checkout/balance:
    post:
      tags: [checkout]
      operationId: checkoutWithBalance
      summary: Buy tickets with the caller's MJNx balance
      description: Requires authentication (rate limited). Not for $0 carts — use the free checkout.
      security:
        - appToken: [events:write]
        - cookieAuth: []
      parameters:
        - { name: invite, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "200":
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  orderId: { type: string }
                  ticketIds: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/checkout/etransfer:
    post:
      tags: [checkout]
      operationId: checkoutWithEtransfer
      summary: Reserve tickets with an Interac e-Transfer hold (72h)
      description: >
        Public. Requires the event to have `emtEmail`. Re-posting an identical open request returns the
        existing order instead of creating a new one.
      x-public: true
      security: []
      parameters:
        - { name: invite, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "200":
          description: Existing open order for the same cart (idempotent replay)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EtransferOrder" }
        "201":
          description: Order created with e-Transfer instructions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EtransferOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/checkout/free:
    post:
      tags: [checkout]
      operationId: checkoutFree
      summary: RSVP to a free ticket tier
      description: Public (rate limited). Authenticated callers RSVP as themselves; guests supply an email.
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, ticketTypeId]
              properties:
                eventId: { type: string }
                ticketTypeId: { type: string }
                email: { type: string, format: email }
                name: { type: string }
                invite: { type: string }
      responses:
        "200":
          description: RSVP confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  ticketId: { type: string }
                  message: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/orders/{id}/confirm-payment:
    post:
      tags: [orders]
      operationId: confirmOrderPayment
      summary: Confirm an order's e-Transfer payment (creator or cohost)
      security:
        - appToken: [events:write]
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Order id }
      responses:
        "200":
          description: All held e-Transfer tickets of the order confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmedCount: { type: integer }
                  orderId: { type: string }
                  tickets: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/orders/{id}/refund:
    post:
      tags: [orders]
      operationId: refundOrder
      summary: Refund every valid/used ticket in an order (creator or cohost)
      security:
        - appToken: [events:write]
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Order id }
      responses:
        "200":
          description: Order refunded
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string }
                  refundedTickets: { type: integer }
                  status: { type: string, enum: [refunded] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/balance:
    get:
      tags: [proxy]
      operationId: getBalance
      summary: The caller's MJNx balance (proxied from the pay service)
      security:
        - appToken: [events:read]
        - cookieAuth: []
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance: { type: number }
                  currency: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502":
          description: Pay service unavailable (body is a zero balance flagged `unavailable`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance: { type: number }
                  currency: { type: string }
                  unavailable: { type: boolean }

  /api/webhook/payment:
    post:
      tags: [webhooks]
      operationId: paymentWebhook
      summary: Checkout-completed webhook from the pay service
      description: Creates the order and tickets for a completed Stripe checkout. Authenticated with the shared `WEBHOOK_SECRET`.
      security:
        - webhookBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Pay service payload (session id, payment id, amounts and checkout metadata incl. `eventId`, `cart`, `buyerDid`).
      responses:
        "200":
          description: Processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/webhook/settlement:
    post:
      tags: [webhooks]
      operationId: settlementWebhook
      summary: .fair settlement snapshot webhook
      description: >
        Stores the resolved .fair settlement on the order. Authenticated with the shared `WEBHOOK_SECRET` in
        the `x-webhook-secret` header. The body may be bare or wrapped in a bus envelope (`{ payload }`).
      security:
        - webhookSecretHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: string }
                eventId: { type: string }
                buyerDid: { type: string }
                amount: { type: integer }
                currency: { type: string }
                totalAmount: { type: integer }
                netAmount: { type: integer }
                fees: { type: array, items: { type: object } }
                chain: { type: array, items: { type: object } }
                payload: { type: object, description: Bus-envelope form; the settlement fields live here }
      responses:
        "200":
          description: Snapshot saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
